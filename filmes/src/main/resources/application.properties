spring.application.name=filmes

server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:filmesdb}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

auth0.issuer=${AUTH0_ISSUER_URI:https://dev-xiu6cdl8suiyoyc6.us.auth0.com/}
auth0.audience=${AUTH0_AUDIENCE:https://api.plataforma-filmes}
auth0.jwk-set-uri=${AUTH0_JWK_SET_URI:https://dev-xiu6cdl8suiyoyc6.us.auth0.com/.well-known/jwks.json}

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.cors.allowed-origins=${FRONTEND_ORIGINS:${app.cors.allowed-origin}}
tmdb.api-key=${TMDB_API_KEY:}
catalog.seed-count=${CATALOG_SEED_COUNT:0}
