spring.datasource.url=jdbc:h2:mem:filmes_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

auth0.issuer=https://test.auth0.com/
auth0.audience=https://api.plataforma-filmes
auth0.jwk-set-uri=https://test.auth0.com/.well-known/jwks.json

app.cors.allowed-origin=http://localhost:5500