name: Movies CI e deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: filmes/pom.xml
      - name: Testes e relatório JaCoCo
        run: mvn -B -f filmes/pom.xml clean verify
      - name: Exigir cobertura JaCoCo de 80%
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('filmes/tests/jacoco.xml').getroot()
          counter = next(c for c in report.findall('counter') if c.get('type') == 'INSTRUCTION')
          covered, missed = int(counter.get('covered')), int(counter.get('missed'))
          percentage = 100 * covered / (covered + missed)
          print(f'Cobertura JaCoCo: {percentage:.2f}%')
          if percentage < 80:
              raise SystemExit('Cobertura abaixo dos 80% exigidos pelo projeto')
          PY

  docker:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Construir e publicar imagem
        uses: docker/build-push-action@v5
        with:
          context: ./filmes
          file: ./filmes/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-filmes-movies:${{ github.sha }}
      - name: Atualizar serviço na AWS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          AUTH0_ISSUER_URI: ${{ secrets.AUTH0_ISSUER_URI }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          AUTH0_JWK_SET_URI: ${{ secrets.AUTH0_JWK_SET_URI }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          envs: DB_USER,DB_PASSWORD,TMDB_API_KEY,AUTH0_ISSUER_URI,AUTH0_AUDIENCE,AUTH0_JWK_SET_URI,FRONTEND_ORIGIN
          script: |
            set -eu
            docker network inspect rede >/dev/null
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-filmes-movies:${{ github.sha }}
            docker stop movies-service || true
            docker rm movies-service || true
            docker run -d \
              --name movies-service \
              --restart unless-stopped \
              --network rede \
              -p 8081:8081 \
              -e DB_HOST=postgres-filmes \
              -e DB_PORT=5432 \
              -e DB_NAME=filmesdb \
              -e CATALOG_SEED_COUNT=20 \
              -e DB_USER="$DB_USER" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e TMDB_API_KEY="$TMDB_API_KEY" \
              -e AUTH0_ISSUER_URI="$AUTH0_ISSUER_URI" \
              -e AUTH0_AUDIENCE="$AUTH0_AUDIENCE" \
              -e AUTH0_JWK_SET_URI="$AUTH0_JWK_SET_URI" \
              -e FRONTEND_ORIGIN="$FRONTEND_ORIGIN" \
              ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-filmes-movies:${{ github.sha }}
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:8081/filmes >/dev/null; then
                echo 'Movies disponível em 8081'
                exit 0
              fi
              sleep 2
            done
            docker logs --tail 60 movies-service
            exit 1
