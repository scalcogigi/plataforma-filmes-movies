services:
  postgres-filmes:
    image: postgres:17
    container_name: postgres-filmes
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-filmesdb}
      POSTGRES_USER: ${DB_USER:?Defina DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - postgres-filmes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rede

volumes:
  postgres-filmes-data:

networks:
  rede:
    external: true
